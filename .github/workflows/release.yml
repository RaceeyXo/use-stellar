name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Test, Build, Publish & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Verify release version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./packages/core/package.json').version")"

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release tag $TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      # One install, with integrity enforced. A release is the last place to
      # let the lockfile drift: `--frozen-lockfile=false` would let the
      # published artifact be built against versions no CI run ever tested.
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build
      - name: Package smoke test
        run: pnpm test:package

      - name: Select npm dist-tag
        id: release_channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk "/^## \\[$VERSION\\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)"

          if ! grep -q '[^[:space:]]' <<< "$NOTES"; then
            echo "No changelog section found for $VERSION"
            exit 1
          fi

          DELIMITER="RELEASE_NOTES_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "notes<<$DELIMITER"
            printf '%s\n' "$NOTES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.GITHUB_REF_NAME,
              name: process.env.GITHUB_REF_NAME,
              body: process.env.RELEASE_NOTES,
            })

      - name: Publish to npm
        working-directory: packages/core
        run: pnpm publish --no-git-checks --provenance --tag "${{ steps.release_channel.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
