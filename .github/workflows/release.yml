name: Release

# Manual only. Pushing a tag does NOT publish: a release happens when a
# maintainer starts this workflow by hand (Actions → Release → Run workflow)
# and picks the version tag under "Use workflow from".
#
# The run must be started from a `vX.Y.Z` tag, not a branch — the tag name is
# the version that gets verified, released and published, so a run started
# from a branch stops at "Verify release version".
on:
  workflow_dispatch:

jobs:
  release:
    name: Test, Build, Publish & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Verify release version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
          VUE_VERSION="$(node -p "require('./packages/vue/package.json').version")"

          if [[ "$TAG_VERSION" != "$CORE_VERSION" || "$TAG_VERSION" != "$VUE_VERSION" ]]; then
            echo "Release tag $TAG_VERSION does not match core $CORE_VERSION and Vue $VUE_VERSION"
            exit 1
          fi

      # One install, with integrity enforced. A release is the last place to
      # let the lockfile drift: `--frozen-lockfile=false` would let the
      # published artifact be built against versions no CI run ever tested.
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # The demo typechecks against the library's generated declarations, so
      # the library has to be built before `pnpm typecheck` runs.
      - name: Build library
        run: |
          pnpm build:lib
          pnpm --filter @use-stellar/vue build
      - name: Type check
        run: |
          pnpm typecheck
          pnpm --filter @use-stellar/vue typecheck
      - name: Test packages
        run: |
          pnpm test
          pnpm --filter @use-stellar/vue test

      - run: pnpm build
      - name: Package smoke test
        run: |
          pnpm test:package
          pnpm --filter @use-stellar/vue test:package

      - name: Select npm dist-tag
        id: release_channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk "/^## \\[$VERSION\\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)"

          if ! grep -q '[^[:space:]]' <<< "$NOTES"; then
            echo "No changelog section found for $VERSION"
            exit 1
          fi

          DELIMITER="RELEASE_NOTES_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "notes<<$DELIMITER"
            printf '%s\n' "$NOTES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.GITHUB_REF_NAME,
              name: process.env.GITHUB_REF_NAME,
              body: process.env.RELEASE_NOTES,
            })

      - name: Publish to npm
        working-directory: packages/core
        run: pnpm publish --no-git-checks --provenance --tag "${{ steps.release_channel.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Publish Vue adapter to npm
        working-directory: packages/vue
        run: pnpm publish --no-git-checks --provenance --tag "${{ steps.release_channel.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
